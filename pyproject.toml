[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-microstructure-engine"
version = "0.1.0"
description = "Research framework for market microstructure and execution analytics"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "pandas>=2.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
